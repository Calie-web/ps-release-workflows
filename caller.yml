# Per-module caller workflow. Place at .github/workflows/release.yml in each
# module repo. A semver tag (git tag vX.Y.Z && git push origin vX.Y.Z) publishes
# a signed release; a manual run (workflow_dispatch) does the same via the
# "version" input (useful if tag-push events are restricted on the org).
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.6.0 (must equal $this->version)'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    uses: Calie-web/ps-release-workflows/.github/workflows/release.yml@main
    with:
      php_version: '8.1'
      release_json: 'release.json'
      version: ${{ inputs.version }}
    secrets:
      TPU_SIGNING_KEY: ${{ secrets.TPU_SIGNING_KEY }}
